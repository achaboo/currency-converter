<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>外貨→日本円 自動換算ツール</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="外貨換算" />
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --line: #dbe3ee;
        --primary: #0f766e;
        --primary-hover: #0b5f58;
        --danger: #b91c1c;
        --shadow: 0 8px 22px rgba(12, 36, 62, 0.08);
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: sans-serif; color: var(--text); background: var(--bg); }
      .container { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
      .toolbar { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px; }
      input[type="text"] { border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 120px; text-transform: uppercase; }
      button { border: 0; border-radius: 10px; padding: 10px 14px; color: #fff; background: var(--primary); cursor: pointer; font-weight: 700; }
      .sync-ok { color: var(--primary); }
      .sync-err { color: var(--danger); }

      /* ===== 上部: サマリー + チャート横並び ===== */
      .top-section { display: flex; gap: 16px; margin: 18px 0; align-items: stretch; }
      .summary { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); flex: 0 0 300px; min-width: 0; }
      .total-value { font-size: 2.4rem; font-weight: 800; margin: 4px 0; }
      .overview-chart { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .overview-chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      .overview-chart-header h3 { margin: 0; font-size: 0.95rem; font-weight: 700; }
      .overview-chart-loading { text-align: center; padding: 40px 0; color: var(--muted); font-size: 0.85rem; }
      .overview-chart-container { flex: 1; position: relative; min-height: 200px; }
      .overview-chart-container canvas { width: 100% !important; height: 100% !important; }
      .legend-bar { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 8px; font-size: 0.75rem; color: var(--muted); }
      .legend-item { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
      .legend-item.dimmed { opacity: 0.3; }
      .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

      @media (max-width: 700px) {
        .top-section { flex-direction: column; }
        .summary { flex: none; }
      }

      /* ===== 通貨グリッド ===== */
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
      .delete-btn { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; }
      .chart-btn { background: none; border: none; color: var(--primary); padding: 0; font-size: 0.8rem; cursor: pointer; font-weight: 600; text-decoration: underline; margin-top: 6px; display: inline-block; }

      /* ===== 個別チャートモーダル ===== */
      .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; }
      .modal-overlay.active { display: flex; }
      .modal-content { background: var(--card); border-radius: 16px; padding: 24px; width: 92%; max-width: 600px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); position: relative; }
      .modal-close { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 1.5rem; color: var(--muted); cursor: pointer; padding: 4px 8px; }
      .modal-title { margin: 0 0 4px 0; font-size: 1.2rem; font-weight: 700; }
      .modal-subtitle { margin: 0 0 16px 0; font-size: 0.85rem; color: var(--muted); }
      .chart-container { width: 100%; height: 260px; position: relative; }
      .chart-container canvas { width: 100% !important; height: 100% !important; }
      .chart-loading { text-align: center; padding: 60px 0; color: var(--muted); }
      .chart-error { text-align: center; padding: 40px 0; color: var(--danger); font-size: 0.9rem; }
      .chart-stats { display: flex; gap: 16px; margin-top: 12px; font-size: 0.82rem; color: var(--muted); flex-wrap: wrap; }
      .chart-stats span { white-space: nowrap; }
      .chart-stats strong { color: var(--text); }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="config.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>外貨→日本円 自動換算ツール</h1>
      <section class="toolbar">
        <button id="fetchBtn" type="button">為替レート取得</button>
        <input id="addCurrencyInput" type="text" placeholder="EUR" maxlength="6" />
        <button id="addCurrencyBtn" type="button" style="background:#334155;">追加</button>
      </section>

      <!-- 上部: サマリー（左）+ 重ねチャート（右）-->
      <section class="top-section">
        <div class="summary">
          <p>全通貨の日本円合計</p>
          <p id="totalJpy" class="total-value">¥0</p>
          <p id="timestamp">取得日時: 未取得</p>
          <p id="status"></p>
        </div>
        <div class="overview-chart">
          <div class="overview-chart-header">
            <h3>直近1カ月の変動率 (%)</h3>
          </div>
          <div class="overview-chart-container">
            <canvas id="overviewCanvas"></canvas>
          </div>
          <div id="overviewLoading" class="overview-chart-loading">チャート読み込み中...</div>
          <div class="legend-bar" id="overviewLegend"></div>
        </div>
      </section>

      <section id="currencyGrid" class="grid"></section>
    </main>

    <!-- 個別チャートモーダル -->
    <div id="chartModal" class="modal-overlay">
      <div class="modal-content">
        <button class="modal-close" id="chartClose">&times;</button>
        <h3 class="modal-title" id="chartTitle">USD/JPY</h3>
        <p class="modal-subtitle" id="chartSubtitle">直近1カ月の値動き</p>
        <div id="chartArea"><div class="chart-loading">読み込み中...</div></div>
        <div class="chart-stats" id="chartStats"></div>
      </div>
    </div>

    <script>
      /* ========================================
       *  設定
       * ======================================== */
      // Finnhub API: FINNHUB_API_KEY は config.js で定義（.gitignore 対象）
      const FINNHUB_FOREX_URL = `https://finnhub.io/api/v1/forex/rates?base=USD&token=${FINNHUB_API_KEY}`;
      const initialCurrencies = ["USD", "THB", "KRW", "INR", "CNY", "EUR", "VND", "PHP"];
      const FIREBASE_CONFIG = {
        apiKey: "AIzaSyBm4fAHdtsf3NNlEmzUIJstPPTF2DSsGWk",
        authDomain: "currency-converter-3892e.firebaseapp.com",
        projectId: "currency-converter-3892e",
        appId: "1:631428748103:web:f16f1d9a58f2324f0eb262"
      };

      // 通貨ごとの色（最大16色、足りなければ循環）
      const COLORS = [
        "#2563eb", "#dc2626", "#16a34a", "#d97706", "#9333ea",
        "#0891b2", "#e11d48", "#65a30d", "#7c3aed", "#ea580c",
        "#0d9488", "#c026d3", "#4f46e5", "#ca8a04", "#059669", "#be123c"
      ];
      function getColor(i) { return COLORS[i % COLORS.length]; }

      const uid = new URLSearchParams(window.location.search).get("uid") || "anonymous";

      /* ========================================
       *  アプリの状態
       * ======================================== */
      const state = {
        currencies: [...initialCurrencies],
        amounts: {},
        rates: {},
        lastUpdated: ""
      };

      let db, stateDocRef;
      let isRemoteUpdate = false;
      let dbInitialized = false;
      let saveTimer = null;
      let chartInstance = null;      // 個別モーダル用
      let overviewChart = null;      // 右上の重ねチャート用
      let overviewCache = {};        // 通貨コード → {dates, values} のキャッシュ
      let hiddenCurrencies = new Set(); // 凡例でトグル非表示中の通貨

      /* ========================================
       *  DOM 参照
       * ======================================== */
      const totalJpyEl = document.getElementById("totalJpy");
      const timestampEl = document.getElementById("timestamp");
      const statusEl = document.getElementById("status");
      const currencyGrid = document.getElementById("currencyGrid");
      const chartModal = document.getElementById("chartModal");
      const chartTitle = document.getElementById("chartTitle");
      const chartSubtitle = document.getElementById("chartSubtitle");
      const chartArea = document.getElementById("chartArea");
      const chartStats = document.getElementById("chartStats");
      const overviewCanvas = document.getElementById("overviewCanvas");
      const overviewLoading = document.getElementById("overviewLoading");
      const overviewLegend = document.getElementById("overviewLegend");

      /* ========================================
       *  合計値のみ更新
       * ======================================== */
      function updateTotal() {
        let total = 0;
        state.currencies.forEach(code => {
          const amount = parseFloat(String(state.amounts[code] || "0").replace(/,/g, "")) || 0;
          const rate = state.rates[code] || 0;
          if (rate > 0) total += amount / rate;
        });
        totalJpyEl.textContent = `¥${Math.round(total).toLocaleString()}`;
        timestampEl.textContent = `取得日時: ${state.lastUpdated || "未取得"}`;
      }

      /* ========================================
       *  カード1枚分の換算表示を更新
       * ======================================== */
      function updateCardDisplay(code) {
        const infoEl = document.querySelector(`[data-info="${code}"]`);
        if (!infoEl) return;
        const amount = parseFloat(String(state.amounts[code] || "0").replace(/,/g, "")) || 0;
        const rate = state.rates[code] || 0;
        const jpy = rate > 0 ? amount / rate : 0;
        infoEl.innerHTML = `レート: 1 JPY = ${rate ? rate.toLocaleString() : "-"} ${code}<br>換算: ¥${Math.round(jpy).toLocaleString()}`;

        // 1通貨 = ?円 の価格表示
        const priceEl = document.querySelector(`[data-price="${code}"]`);
        if (priceEl) {
          if (rate > 0) {
            const jpyPerUnit = 1 / rate;
            const decimals = jpyPerUnit >= 10 ? 2 : jpyPerUnit >= 1 ? 3 : 4;
            priceEl.textContent = `${jpyPerUnit.toFixed(decimals)}円`;
          } else {
            priceEl.textContent = "";
          }
        }
      }

      /* ========================================
       *  通貨マスターデータ（国コード・通貨名・補助単位）
       * ======================================== */
      const CURRENCY_INFO = {
        USD: { cc: "us", name: "米ドル",         sub: "1ドル = 100セント" },
        EUR: { cc: "eu", name: "ユーロ",         sub: "1ユーロ = 100セント" },
        GBP: { cc: "gb", name: "英ポンド",       sub: "1ポンド = 100ペンス" },
        JPY: { cc: "jp", name: "日本円",         sub: "1円 = 100銭" },
        THB: { cc: "th", name: "タイバーツ",     sub: "1バーツ = 100サタン" },
        KRW: { cc: "kr", name: "韓国ウォン",     sub: "ウォン" },
        INR: { cc: "in", name: "インドルピー",   sub: "1ルピー = 100パイサ" },
        CNY: { cc: "cn", name: "中国元",         sub: "1元 = 10角 = 100分" },
        VND: { cc: "vn", name: "ベトナムドン",   sub: "ドン" },
        PHP: { cc: "ph", name: "フィリピンペソ", sub: "1ペソ = 100センタボ" },
        AUD: { cc: "au", name: "豪ドル",         sub: "1ドル = 100セント" },
        CAD: { cc: "ca", name: "カナダドル",     sub: "1ドル = 100セント" },
        CHF: { cc: "ch", name: "スイスフラン",   sub: "1フラン = 100サンチーム" },
        SGD: { cc: "sg", name: "シンガポールドル", sub: "1ドル = 100セント" },
        HKD: { cc: "hk", name: "香港ドル",       sub: "1ドル = 100セント" },
        NZD: { cc: "nz", name: "NZドル",         sub: "1ドル = 100セント" },
        MXN: { cc: "mx", name: "メキシコペソ",   sub: "1ペソ = 100センタボ" },
        MYR: { cc: "my", name: "マレーシアリンギット", sub: "1リンギット = 100セン" },
        IDR: { cc: "id", name: "インドネシアルピア", sub: "1ルピア = 100セン" },
        TRY: { cc: "tr", name: "トルコリラ",     sub: "1リラ = 100クルシュ" },
        ZAR: { cc: "za", name: "南アフリカランド", sub: "1ランド = 100セント" },
        SEK: { cc: "se", name: "スウェーデンクローナ", sub: "1クローナ = 100オーレ" },
        NOK: { cc: "no", name: "ノルウェークローネ", sub: "1クローネ = 100オーレ" },
        DKK: { cc: "dk", name: "デンマーククローネ", sub: "1クローネ = 100オーレ" },
        PLN: { cc: "pl", name: "ポーランドズロチ", sub: "1ズロチ = 100グロシ" },
        CZK: { cc: "cz", name: "チェココルナ",   sub: "1コルナ = 100ハレジュ" },
        HUF: { cc: "hu", name: "ハンガリーフォリント", sub: "フォリント" },
        ILS: { cc: "il", name: "イスラエルシェケル", sub: "1シェケル = 100アゴラ" },
        BRL: { cc: "br", name: "ブラジルレアル", sub: "1レアル = 100センターボ" },
        RON: { cc: "ro", name: "ルーマニアレウ", sub: "1レウ = 100バニ" },
        BGN: { cc: "bg", name: "ブルガリアレフ", sub: "1レフ = 100ストティンキ" },
        ISK: { cc: "is", name: "アイスランドクローナ", sub: "クローナ" },
        TWD: { cc: "tw", name: "台湾ドル",       sub: "1元 = 10角 = 100分" },
        KHR: { cc: "kh", name: "カンボジアリエル", sub: "1リエル = 100セン" },
        MMK: { cc: "mm", name: "ミャンマーチャット", sub: "1チャット = 100ピャー" },
        LAK: { cc: "la", name: "ラオスキープ",   sub: "1キープ = 100アット" },
        BND: { cc: "bn", name: "ブルネイドル",   sub: "1ドル = 100セン" },
        AED: { cc: "ae", name: "UAEディルハム",  sub: "1ディルハム = 100フィルス" },
        SAR: { cc: "sa", name: "サウジリヤル",   sub: "1リヤル = 100ハララ" },
        QAR: { cc: "qa", name: "カタールリヤル", sub: "1リヤル = 100ディルハム" },
        KWD: { cc: "kw", name: "クウェートディナール", sub: "1ディナール = 1000フィルス" },
        BHD: { cc: "bh", name: "バーレーンディナール", sub: "1ディナール = 1000フィルス" },
        OMR: { cc: "om", name: "オマーンリアル", sub: "1リアル = 1000バイサ" },
        EGP: { cc: "eg", name: "エジプトポンド", sub: "1ポンド = 100ピアストル" },
        NGN: { cc: "ng", name: "ナイジェリアナイラ", sub: "1ナイラ = 100コボ" },
        KES: { cc: "ke", name: "ケニアシリング", sub: "1シリング = 100セント" },
        CLP: { cc: "cl", name: "チリペソ",       sub: "ペソ" },
        COP: { cc: "co", name: "コロンビアペソ", sub: "1ペソ = 100センタボ" },
        ARS: { cc: "ar", name: "アルゼンチンペソ", sub: "1ペソ = 100センターボ" },
        PEN: { cc: "pe", name: "ペルーソル",     sub: "1ソル = 100センティモ" },
      };

      // CDN国旗画像のIMGタグを返す
      function getFlagImg(code) {
        const info = CURRENCY_INFO[code];
        if (!info) return "";
        return `<img src="https://flagcdn.com/24x18/${info.cc}.png" alt="${code}" style="width:24px;height:18px;vertical-align:middle;border-radius:2px;object-fit:cover;">`;
      }
      function rebuildGrid() {
        currencyGrid.innerHTML = "";
        state.currencies.forEach(code => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div>
                <strong style="font-size:1rem;">${getFlagImg(code)} ${code}</strong>
                <div style="font-size:0.85rem; color:#2563eb; font-weight:600; margin-top:2px;" data-price="${code}"></div>
                <div style="font-size:0.7rem; color:#888; margin-top:1px;">${CURRENCY_INFO[code] ? CURRENCY_INFO[code].sub : ""}</div>
              </div>
              <button class="delete-btn" data-remove="${code}">削除</button>
            </div>
            <div style="margin-top:10px;">
              <label style="font-size:0.8rem; color:#666;">金額</label>
              <input type="text" value="${state.amounts[code] || ""}" data-code="${code}" style="width:100%;">
            </div>
            <div style="margin-top:10px; font-size:0.85rem;" data-info="${code}"></div>
            <button class="chart-btn" data-chart="${code}">📈 1カ月チャート</button>
          `;
          currencyGrid.appendChild(card);
          updateCardDisplay(code);
        });
        updateTotal();
      }

      /* ========================================
       *  デバウンス付き Firestore 保存
       * ======================================== */
      function scheduleSave() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(() => saveToDB(), 500);
      }

      async function saveToDB() {
        if (!stateDocRef || isRemoteUpdate || !dbInitialized) return;
        try {
          statusEl.textContent = `保存中... (ID: ${uid})`;
          statusEl.className = "";
          await stateDocRef.set({
            currencies: state.currencies,
            amounts: state.amounts,
            rates: state.rates,
            lastUpdated: state.lastUpdated,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          statusEl.textContent = `✓ 保存完了 (ID: ${uid})`;
          statusEl.className = "sync-ok";
        } catch (e) {
          console.error("保存失敗", e);
          statusEl.textContent = "✗ 保存失敗";
          statusEl.className = "sync-err";
        }
      }

      /* ========================================
       *  為替レート取得
       * ======================================== */
      async function fetchRates() {
        statusEl.textContent = "レート取得中...";
        statusEl.className = "";
        try {
          const res = await fetch(FINNHUB_FOREX_URL);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          // Finnhub は USD ベースで返す: { base: "USD", quote: { JPY: 150.5, EUR: 0.92, ... } }
          const quotes = data.quote || {};
          const usdJpy = quotes["JPY"];
          if (!usdJpy || usdJpy <= 0) throw new Error("USD/JPY レートを取得できませんでした");

          state.currencies.forEach(code => {
            if (code === "JPY") {
              state.rates["JPY"] = 1;
              return;
            }
            const usdRate = quotes[code];
            if (usdRate && usdRate > 0) {
              // USD基準 → JPY基準へ変換
              // 1 JPY = (usdRate / usdJpy) [code]
              state.rates[code] = usdRate / usdJpy;
            }
          });

          state.lastUpdated = new Date().toLocaleString("ja-JP");
          state.currencies.forEach(code => updateCardDisplay(code));
          updateTotal();
          statusEl.textContent = "レートを更新しました。";
          statusEl.className = "sync-ok";
          await saveToDB();
        } catch (e) {
          console.error("レート取得エラー:", e);
          statusEl.textContent = `レート取得失敗: ${e.message}`;
          statusEl.className = "sync-err";
        }
      }

      /* ========================================
       *  ★ 右上の重ねチャート（変動率ベース）
       * ======================================== */
      // Finnhub FX 履歴: 通貨ペアのOANDAシンボルと計算モード
      // mode: "usd_jpy"  → 終値がそのまま JPY/USD
      // mode: "code_usd" → 終値 × USD_JPY = JPY/CODE  （EUR_USD など主要通貨）
      // mode: "usd_code" → USD_JPY ÷ 終値 = JPY/CODE  （USD_THB などEM通貨）
      const FINNHUB_SUPPORTED_SYMBOLS = {
        USD: { symbol: "OANDA:USD_JPY", mode: "usd_jpy"  },
        EUR: { symbol: "OANDA:EUR_USD", mode: "code_usd" },
        GBP: { symbol: "OANDA:GBP_USD", mode: "code_usd" },
        AUD: { symbol: "OANDA:AUD_USD", mode: "code_usd" },
        NZD: { symbol: "OANDA:NZD_USD", mode: "code_usd" },
        CAD: { symbol: "OANDA:USD_CAD", mode: "usd_code" },
        CHF: { symbol: "OANDA:USD_CHF", mode: "usd_code" },
        SGD: { symbol: "OANDA:USD_SGD", mode: "usd_code" },
        HKD: { symbol: "OANDA:USD_HKD", mode: "usd_code" },
        THB: { symbol: "OANDA:USD_THB", mode: "usd_code" },
        KRW: { symbol: "OANDA:USD_KRW", mode: "usd_code" },
        INR: { symbol: "OANDA:USD_INR", mode: "usd_code" },
        CNY: { symbol: "OANDA:USD_CNH", mode: "usd_code" },
        VND: { symbol: "OANDA:USD_VND", mode: "usd_code" },
        PHP: { symbol: "OANDA:USD_PHP", mode: "usd_code" },
        MXN: { symbol: "OANDA:USD_MXN", mode: "usd_code" },
        MYR: { symbol: "OANDA:USD_MYR", mode: "usd_code" },
        IDR: { symbol: "OANDA:USD_IDR", mode: "usd_code" },
        TRY: { symbol: "OANDA:USD_TRY", mode: "usd_code" },
        ZAR: { symbol: "OANDA:USD_ZAR", mode: "usd_code" },
        SEK: { symbol: "OANDA:USD_SEK", mode: "usd_code" },
        NOK: { symbol: "OANDA:USD_NOK", mode: "usd_code" },
        DKK: { symbol: "OANDA:USD_DKK", mode: "usd_code" },
        PLN: { symbol: "OANDA:USD_PLN", mode: "usd_code" },
        TWD: { symbol: "OANDA:USD_TWD", mode: "usd_code" },
      };

      let usdJpyCandleCache = null;

      async function fetchFinnhubCandles(symbol) {
        const to = Math.floor(Date.now() / 1000);
        const from = to - 35 * 24 * 60 * 60; // 35日前
        const url = `https://finnhub.io/api/v1/forex/candle?symbol=${encodeURIComponent(symbol)}&resolution=D&from=${from}&to=${to}&token=${FINNHUB_API_KEY}`;
        try {
          const res = await fetch(url);
          if (!res.ok) return null;
          const data = await res.json();
          if (data.s !== "ok" || !data.t || data.t.length === 0) return null;
          return data;
        } catch (e) {
          console.error(`Finnhub candle fetch error (${symbol}):`, e);
          return null;
        }
      }

      async function getUsdJpyCandles() {
        if (!usdJpyCandleCache) {
          usdJpyCandleCache = await fetchFinnhubCandles("OANDA:USD_JPY");
        }
        return usdJpyCandleCache;
      }

      async function fetchHistoryForCurrency(code) {
        if (overviewCache[code]) return overviewCache[code];
        const symInfo = FINNHUB_SUPPORTED_SYMBOLS[code];
        if (!symInfo) return null;

        let dates, jpyRates;

        if (symInfo.mode === "usd_jpy") {
          const candle = await fetchFinnhubCandles(symInfo.symbol);
          if (!candle) return null;
          dates = candle.t.map(ts => new Date(ts * 1000).toISOString().split("T")[0]);
          jpyRates = [...candle.c];
        } else {
          const [candle, usdJpy] = await Promise.all([
            fetchFinnhubCandles(symInfo.symbol),
            getUsdJpyCandles()
          ]);
          if (!candle || !usdJpy) return null;

          const usdJpyMap = {};
          usdJpy.t.forEach((ts, i) => {
            usdJpyMap[new Date(ts * 1000).toISOString().split("T")[0]] = usdJpy.c[i];
          });

          const pairs = candle.t.map((ts, i) => {
            const date = new Date(ts * 1000).toISOString().split("T")[0];
            const ref = usdJpyMap[date];
            if (!ref || !candle.c[i]) return null;
            const jpyRate = symInfo.mode === "code_usd"
              ? candle.c[i] * ref   // e.g. EUR/USD × USD/JPY = EUR/JPY
              : ref / candle.c[i];  // e.g. USD/JPY ÷ USD/THB = THB/JPY
            return { date, jpyRate };
          }).filter(Boolean);

          if (pairs.length === 0) return null;
          dates = pairs.map(p => p.date);
          jpyRates = pairs.map(p => p.jpyRate);
        }

        if (dates.length === 0) return null;
        const base = jpyRates[0];
        const pctValues = jpyRates.map(v => ((v - base) / base) * 100);
        const result = { dates, pctValues, jpyRates };
        overviewCache[code] = result;
        return result;
      }

      async function buildOverviewChart() {
        overviewLoading.style.display = "block";
        overviewCanvas.style.display = "none";

        // 全通貨のデータを並列取得
        const results = await Promise.all(
          state.currencies.map(async code => {
            const data = await fetchHistoryForCurrency(code);
            return { code, data };
          })
        );

        // 有効なデータのみ
        const validResults = results.filter(r => r.data !== null);

        if (validResults.length === 0) {
          overviewLoading.textContent = "チャートデータなし";
          overviewLegend.innerHTML = "";
          return;
        }

        // 共通の日付ラベル（最長のものを使用）
        let longestDates = [];
        validResults.forEach(r => {
          if (r.data.dates.length > longestDates.length) longestDates = r.data.dates;
        });
        const labels = longestDates.map(d => {
          const [, m, day] = d.split("-");
          return `${parseInt(m)}/${parseInt(day)}`;
        });

        // データセット作成
        const datasets = validResults.map((r, i) => {
          const colorIdx = state.currencies.indexOf(r.code);
          const color = getColor(colorIdx >= 0 ? colorIdx : i);
          const isHidden = hiddenCurrencies.has(r.code);

          // 日付を合わせてマッピング
          const dataMap = {};
          r.data.dates.forEach((d, j) => { dataMap[d] = r.data.pctValues[j]; });
          const alignedData = longestDates.map(d => dataMap[d] ?? null);

          return {
            label: r.code,
            data: alignedData,
            borderColor: color,
            backgroundColor: "transparent",
            tension: 0.3,
            pointRadius: 0,
            pointHoverRadius: 4,
            pointHoverBackgroundColor: color,
            borderWidth: 2,
            hidden: isHidden
          };
        });

        overviewLoading.style.display = "none";
        overviewCanvas.style.display = "block";

        if (overviewChart) overviewChart.destroy();

        const ctx = overviewCanvas.getContext("2d");
        overviewChart = new Chart(ctx, {
          type: "line",
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y !== null ? ctx.parsed.y.toFixed(2) : "-"}%`
                }
              }
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: { maxTicksLimit: 7, font: { size: 10 } }
              },
              y: {
                grid: { color: "#eee" },
                ticks: {
                  font: { size: 10 },
                  callback: v => v.toFixed(1) + "%"
                }
              }
            },
            interaction: { intersect: false, mode: "index" }
          }
        });

        // カスタム凡例の構築
        buildOverviewLegend(validResults);
      }

      function buildOverviewLegend(validResults) {
        overviewLegend.innerHTML = "";
        validResults.forEach((r, i) => {
          const colorIdx = state.currencies.indexOf(r.code);
          const color = getColor(colorIdx >= 0 ? colorIdx : i);
          const isHidden = hiddenCurrencies.has(r.code);

          const item = document.createElement("span");
          item.className = `legend-item${isHidden ? " dimmed" : ""}`;
          item.innerHTML = `<span class="legend-dot" style="background:${color}"></span>${r.code}`;
          item.addEventListener("click", () => {
            if (hiddenCurrencies.has(r.code)) {
              hiddenCurrencies.delete(r.code);
            } else {
              hiddenCurrencies.add(r.code);
            }
            // Chart.jsのデータセットをトグル
            if (overviewChart) {
              const dsIndex = overviewChart.data.datasets.findIndex(ds => ds.label === r.code);
              if (dsIndex >= 0) {
                overviewChart.data.datasets[dsIndex].hidden = hiddenCurrencies.has(r.code);
                overviewChart.update();
              }
            }
            item.classList.toggle("dimmed");
          });
          overviewLegend.appendChild(item);
        });

        // 非対応通貨を薄く表示
        state.currencies.forEach(code => {
          if (!FINNHUB_SUPPORTED_SYMBOLS[code]) {
            const item = document.createElement("span");
            item.className = "legend-item dimmed";
            item.innerHTML = `<span class="legend-dot" style="background:#ccc"></span>${code} (非対応)`;
            overviewLegend.appendChild(item);
          }
        });
      }

      /* ========================================
       *  個別チャートモーダル
       * ======================================== */
      async function showChart(code) {
        chartModal.classList.add("active");
        chartTitle.textContent = `${code} / JPY`;
        chartSubtitle.textContent = "直近1カ月の値動き";
        chartArea.innerHTML = `<div class="chart-loading">読み込み中...</div>`;
        chartStats.innerHTML = "";

        try {
          const cached = await fetchHistoryForCurrency(code);
          if (!cached) {
            chartArea.innerHTML = `<div class="chart-error">この通貨（${code}）の履歴データは利用できません。<br>Finnhub API が対応していない通貨です。</div>`;
            return;
          }

          const { dates, jpyRates } = cached;
          const validRates = jpyRates.filter(v => v !== null);
          if (validRates.length === 0) {
            chartArea.innerHTML = `<div class="chart-error">チャートデータが見つかりませんでした。</div>`;
            return;
          }

          const minRate = Math.min(...validRates);
          const maxRate = Math.max(...validRates);
          const firstRate = validRates[0];
          const lastRate = validRates[validRates.length - 1];
          const change = lastRate - firstRate;
          const changePct = ((change / firstRate) * 100).toFixed(2);
          const changeColor = change >= 0 ? "var(--primary)" : "var(--danger)";
          const changeSign = change >= 0 ? "+" : "";
          const decimals = lastRate >= 10 ? 2 : lastRate >= 1 ? 3 : 4;

          chartStats.innerHTML = `
            <span>始値: <strong>${firstRate.toFixed(decimals)} 円</strong></span>
            <span>終値: <strong>${lastRate.toFixed(decimals)} 円</strong></span>
            <span>安値: <strong>${minRate.toFixed(decimals)} 円</strong></span>
            <span>高値: <strong>${maxRate.toFixed(decimals)} 円</strong></span>
            <span>変動: <strong style="color:${changeColor}">${changeSign}${changePct}%</strong></span>
          `;

          chartArea.innerHTML = `<div class="chart-container"><canvas id="rateChart"></canvas></div>`;
          const ctx = document.getElementById("rateChart").getContext("2d");
          if (chartInstance) chartInstance.destroy();

          const labels = dates.map(d => {
            const [, m, day] = d.split("-");
            return `${parseInt(m)}/${parseInt(day)}`;
          });

          chartInstance = new Chart(ctx, {
            type: "line",
            data: {
              labels,
              datasets: [{
                label: `1 ${code} = ? JPY`,
                data: jpyRates,
                borderColor: change >= 0 ? "#0f766e" : "#b91c1c",
                backgroundColor: change >= 0 ? "rgba(15,118,110,0.08)" : "rgba(185,28,28,0.08)",
                fill: true,
                tension: 0.3,
                pointRadius: 0,
                pointHoverRadius: 5,
                pointHoverBackgroundColor: change >= 0 ? "#0f766e" : "#b91c1c",
                borderWidth: 2.5
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: ctx => `${ctx.parsed.y.toFixed(decimals)} 円` } }
              },
              scales: {
                x: { grid: { display: false }, ticks: { maxTicksLimit: 7, font: { size: 11 } } },
                y: { grid: { color: "#eee" }, ticks: { font: { size: 11 }, callback: v => v.toFixed(decimals) } }
              },
              interaction: { intersect: false, mode: "index" }
            }
          });
        } catch (e) {
          console.error("チャート取得エラー:", e);
          chartArea.innerHTML = `<div class="chart-error">チャートデータの取得に失敗しました。</div>`;
        }
      }

      function closeChart() {
        chartModal.classList.remove("active");
        if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
      }
      document.getElementById("chartClose").addEventListener("click", closeChart);
      chartModal.addEventListener("click", e => { if (e.target === chartModal) closeChart(); });

      /* ========================================
       *  onSnapshot: リモートデータの受信
       * ======================================== */
      let prevCurrenciesJson = "";

      function handleSnapshot(doc) {
        isRemoteUpdate = true;

        if (!doc.exists) {
          dbInitialized = true;
          saveToDB();
          isRemoteUpdate = false;
          return;
        }

        const data = doc.data();
        const newCurrencies = data.currencies || [...initialCurrencies];
        const currenciesChanged = JSON.stringify(newCurrencies) !== prevCurrenciesJson;

        state.currencies = newCurrencies;
        state.rates = data.rates || {};
        state.lastUpdated = data.lastUpdated || "";

        const activeCode = document.activeElement?.dataset?.code || null;
        const remoteAmounts = data.amounts || {};

        state.currencies.forEach(code => {
          if (code !== activeCode) {
            state.amounts[code] = remoteAmounts[code] || "";
          }
        });

        if (!dbInitialized) {
          dbInitialized = true;
          rebuildGrid();
          statusEl.textContent = `✓ 保存完了 (ID: ${uid})`;
          statusEl.className = "sync-ok";
          prevCurrenciesJson = JSON.stringify(state.currencies);
          // 初回: 重ねチャートを構築
          buildOverviewChart();
        } else {
          state.currencies.forEach(code => {
            if (code === activeCode) return;
            const inputEl = document.querySelector(`input[data-code="${code}"]`);
            if (inputEl) inputEl.value = state.amounts[code] || "";
          });
          const currentCards = currencyGrid.querySelectorAll("[data-code]");
          const currentCodes = Array.from(currentCards).map(el => el.dataset.code);
          if (JSON.stringify(currentCodes) !== JSON.stringify(state.currencies)) {
            rebuildGrid();
          } else {
            state.currencies.forEach(code => updateCardDisplay(code));
            updateTotal();
          }
          // 通貨リストが変わったら重ねチャートを再構築
          if (currenciesChanged) {
            prevCurrenciesJson = JSON.stringify(state.currencies);
            buildOverviewChart();
          }
        }

        isRemoteUpdate = false;
      }

      /* ========================================
       *  初期化
       * ======================================== */
      function init() {
        if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.firestore();
        stateDocRef = db.collection("fxStates").doc(uid);
        rebuildGrid();
        stateDocRef.onSnapshot(handleSnapshot, err => {
          console.error("onSnapshot エラー:", err);
          statusEl.textContent = "同期エラー";
          statusEl.className = "sync-err";
          dbInitialized = true;
        });
      }

      /* ========================================
       *  イベントリスナー
       * ======================================== */
      document.getElementById("fetchBtn").addEventListener("click", fetchRates);

      document.getElementById("addCurrencyBtn").addEventListener("click", () => {
        const input = document.getElementById("addCurrencyInput");
        const code = input.value.trim().toUpperCase();
        if (code && !state.currencies.includes(code)) {
          state.currencies.push(code);
          input.value = "";
          rebuildGrid();
          scheduleSave();
          // 通貨追加 → 重ねチャート再構築
          buildOverviewChart();
        }
      });

      currencyGrid.addEventListener("input", e => {
        if (e.target.dataset.code) {
          const code = e.target.dataset.code;
          state.amounts[code] = e.target.value;
          updateCardDisplay(code);
          updateTotal();
          scheduleSave();
        }
      });

      currencyGrid.addEventListener("click", e => {
        const removeCode = e.target.dataset.remove;
        if (removeCode) {
          state.currencies = state.currencies.filter(c => c !== removeCode);
          delete state.amounts[removeCode];
          rebuildGrid();
          scheduleSave();
          // 通貨削除 → 重ねチャート再構築
          buildOverviewChart();
          return;
        }
        const chartCode = e.target.dataset.chart;
        if (chartCode) showChart(chartCode);
      });

      init();
    </script>
  </body>
</html>
